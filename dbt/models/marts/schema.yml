version: 2

models:
  - name: fct_loan_features
    description: One row per finished loan with model features and the is_default label.
    columns:
      - name: loan_id
        data_tests: [not_null, unique]
      - name: is_default
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: grade
        data_tests:
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E', 'F', 'G']
      - name: issue_date
        data_tests: [not_null]
